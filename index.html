<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My High Lab · Voice Recorder</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#302642}*{box-sizing:border-box}body{margin:0;background:transparent}.recorder{max-width:540px;margin:0 auto;padding:16px 18px;border:1px solid #e7dff0;border-radius:18px;background:#fbf9fe;box-shadow:0 2px 10px #3320460b}.header{display:flex;align-items:center;gap:9px;margin-bottom:11px}.header svg{color:#7353ba}.title{font-size:15px;font-weight:700}.subtitle{font-size:12px;color:#796c89}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px}.circle{display:inline-grid;place-items:center;border:0;border-radius:50%;width:48px;height:48px;cursor:pointer;background:#7353ba;color:white;transition:transform .15s}.circle:hover:not(:disabled){transform:scale(1.05)}.circle:disabled{opacity:.35;cursor:not-allowed}.circle.stop{background:#b33c64}.secondary{background:#ede6f8;color:#5d438f}.download{font-size:13px;color:#5d438f;text-decoration:none;font-weight:700;padding:10px 5px}.download[hidden]{display:none}.status{font-size:13px;color:#665c71;margin:11px 0 0}.status.error{color:#ac2142}.timer{font-size:13px;font-variant-numeric:tabular-nums;color:#55456b}.playback{margin-top:12px;width:100%;height:36px}button:focus-visible,a:focus-visible{outline:3px solid #e1b1ff;outline-offset:3px}.note{font-size:11px;color:#887c91;margin-top:10px}
</style>
</head>
<body>
<section class="recorder" aria-label="Voice recorder">
  <div class="header"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/></svg><div><div class="title">My High Lab · Voice Recorder</div><div class="subtitle">Record · Listen · Download</div></div></div>
  <div class="actions"><button id="record" class="circle" title="Start recording" aria-label="Start recording"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg></button><button id="stop" class="circle stop" title="Stop recording" aria-label="Stop recording" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button><span id="timer" class="timer">00:00</span><a id="download" class="download" hidden>↓ Download recording</a></div>
  <audio id="playback" class="playback" controls hidden></audio>
  <p id="status" class="status" role="status" aria-live="polite">Press the purple button and allow microphone access.</p>
  <p class="note">Your recording stays in this browser until you download it. Attach the downloaded file to your Moodle answer.</p>
</section>
<script>
(()=>{'use strict';const record=document.getElementById('record'),stop=document.getElementById('stop'),download=document.getElementById('download'),player=document.getElementById('playback'),status=document.getElementById('status'),timer=document.getElementById('timer');let recorder,stream,chunks=[],url=null,started=0,clock=null;const message=(s,error=false)=>{status.textContent=s;status.classList.toggle('error',error)};const format=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;const clean=()=>{if(clock)clearInterval(clock);clock=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};record.addEventListener('click',async()=>{if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){message('Recording is not supported in this browser. Use a modern browser over HTTPS.',true);return}record.disabled=true;download.hidden=true;player.hidden=true;player.removeAttribute('src');if(url){URL.revokeObjectURL(url);url=null}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const types=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'];const type=types.find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];recorder.addEventListener('dataavailable',e=>{if(e.data.size)chunks.push(e.data)});recorder.addEventListener('error',()=>{message('Recording failed. Please try again.',true);clean();record.disabled=false;stop.disabled=true});recorder.addEventListener('stop',()=>{const mime=recorder.mimeType||'audio/webm';const ext=mime.includes('mp4')?'m4a':mime.includes('ogg')?'ogg':'webm';const blob=new Blob(chunks,{type:mime});clean();stop.disabled=true;record.disabled=false;if(!blob.size){message('No audio was recorded. Please try again.',true);return}url=URL.createObjectURL(blob);player.src=url;player.hidden=false;download.href=url;download.download=`my-high-lab-recording-${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`;download.hidden=false;message('Recording ready. Listen, then download and upload it to Moodle.')});recorder.start();started=Date.now();timer.textContent='00:00';clock=setInterval(()=>timer.textContent=format(Math.floor((Date.now()-started)/1000)),250);stop.disabled=false;message('Recording… press Stop when finished.')}catch(e){clean();record.disabled=false;stop.disabled=true;message(e.name==='NotAllowedError'?'Microphone permission was denied. Please allow microphone access and try again.':'Could not start recording. Check your microphone and browser permissions.',true)}});stop.addEventListener('click',()=>{if(recorder?.state==='recording'){recorder.stop();message('Preparing your recording…')}});window.addEventListener('pagehide',()=>{clean();if(url)URL.revokeObjectURL(url)})})();
</script>
</body></html>
