<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Hi Lab · Voice Recorder</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#342947}*{box-sizing:border-box}body{margin:0;background:transparent;padding:5px}.device{max-width:460px;margin:0 auto;background:#faf8fc;border:1px solid #ded6e9;border-radius:16px;padding:12px 14px;box-shadow:0 2px 6px #32234810}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.brand{font-weight:750;font-size:13px}.brand small{display:block;font-size:10px;font-weight:400;color:#766889;margin-top:2px}.indicator{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:750;color:#7d718b}.lamp{height:9px;width:9px;border-radius:50%;background:#c6bfce}.device.is-recording .indicator{color:#b92244}.device.is-recording .lamp{background:#e3274b;box-shadow:0 0 0 3px #e3274b18;animation:pulse 1s infinite}.device.is-recording #record{background:#d53759;animation:buttonpulse 1.2s infinite}@keyframes pulse{50%{opacity:.25;box-shadow:0 0 0 7px #e3274b16}}@keyframes buttonpulse{50%{box-shadow:0 0 0 6px #d5375923}}@media(prefers-reduced-motion:reduce){.device.is-recording .lamp,.device.is-recording #record{animation:none}}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.control{border:0;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;background:#7950b3;color:white;cursor:pointer}.control.stop{background:#b14f6e}.control:disabled{opacity:.32;cursor:not-allowed}.control:not(:disabled):hover{filter:brightness(.94)}.clock{font-size:13px;font-variant-numeric:tabular-nums;min-width:42px}.download{font-size:12px;color:#583c8a;font-weight:700;text-decoration:none;border:1px solid #bcaed1;border-radius:15px;padding:7px 10px;margin-left:auto}.download:hover{text-decoration:underline}.status{font-size:11px;color:#70657d;margin:8px 0 0;line-height:1.35}.status.error{color:#aa2045}.playback{display:block;width:100%;height:35px;margin-top:7px}audio[hidden],a[hidden]{display:none}button:focus-visible,a:focus-visible{outline:3px solid #d9b6ff;outline-offset:2px}
</style>
</head>
<body>
<section class="device" id="device" aria-label="My Hi Lab voice recorder">
 <div class="top"><div class="brand">🎙 My Hi Lab · Voice Recorder<small>Record · Listen · Download</small></div><div class="indicator"><span class="lamp" aria-hidden="true"></span><span id="indicator">READY</span></div></div>
 <div class="row">
  <button type="button" class="control" id="record" aria-label="Start recording" title="Record"><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg></button>
  <button type="button" class="control stop" id="stop" aria-label="Stop recording" title="Stop" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
  <span class="clock" id="timer">00:00</span>
  <a id="download" class="download" hidden>↓ Download audio</a>
 </div>
 <audio id="playback" class="playback" controls hidden></audio>
 <p id="status" class="status" role="status" aria-live="polite">Press the purple button to record. The file stays on your device.</p>
</section>
<script>
(()=>{'use strict';
const device=document.getElementById('device'),record=document.getElementById('record'),stop=document.getElementById('stop'),download=document.getElementById('download'),player=document.getElementById('playback'),status=document.getElementById('status'),timer=document.getElementById('timer'),indicator=document.getElementById('indicator');
let mediaRecorder=null,stream=null,chunks=[],objectURL=null,startTime=0,interval=null;
function msg(s,err=false){status.textContent=s;status.classList.toggle('error',err)}
function clean(){clearInterval(interval);interval=null;stream?.getTracks().forEach(t=>t.stop());stream=null;device.classList.remove('is-recording')}
function displaySeconds(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function resetFile(){download.hidden=true;player.pause();player.hidden=true;player.removeAttribute('src');if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null}}
record.addEventListener('click',async()=>{
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){msg('Recording is unavailable. Use a current browser over HTTPS.',true);return}
 record.disabled=true;resetFile();indicator.textContent='CONNECTING';
 try{
 stream=await navigator.mediaDevices.getUserMedia({audio:true});
 const formats=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'];
 const mime=formats.find(t=>MediaRecorder.isTypeSupported(t));
 mediaRecorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];
 mediaRecorder.addEventListener('dataavailable',e=>{if(e.data.size)chunks.push(e.data)});
 mediaRecorder.addEventListener('error',()=>{clean();indicator.textContent='ERROR';record.disabled=false;stop.disabled=true;msg('Recording error. Please try again.',true)});
 mediaRecorder.addEventListener('stop',()=>{
  const actualMime=mediaRecorder.mimeType||chunks[0]?.type||'audio/webm';const ext=actualMime.includes('mp4')?'m4a':actualMime.includes('ogg')?'ogg':'webm';const blob=new Blob(chunks,{type:actualMime});
  clean();record.disabled=false;stop.disabled=true;indicator.textContent='READY';
  if(!blob.size){msg('No audio captured. Please try again.',true);return}
  objectURL=URL.createObjectURL(blob);player.src=objectURL;player.hidden=false;
  download.href=objectURL;download.download=`my-hi-lab-recording-${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`;download.hidden=false;
  msg('Listen to your recording, then download and attach it to your Moodle answer.');
 });
 mediaRecorder.start();startTime=Date.now();timer.textContent='00:00';interval=setInterval(()=>timer.textContent=displaySeconds(Math.floor((Date.now()-startTime)/1000)),300);
 stop.disabled=false;device.classList.add('is-recording');indicator.textContent='● REC';msg('Recording… press the square button to stop.');
 }catch(e){clean();record.disabled=false;stop.disabled=true;indicator.textContent='READY';msg(e.name==='NotAllowedError'?'Microphone access denied. Please allow it in your browser.':'Could not access the microphone. Check device and browser permissions.',true)}
});
stop.addEventListener('click',()=>{if(mediaRecorder?.state==='recording'){stop.disabled=true;mediaRecorder.stop();indicator.textContent='SAVING';msg('Preparing recording…')}});
window.addEventListener('pagehide',()=>{clean();if(objectURL)URL.revokeObjectURL(objectURL)});
})();
</script>
</body>
</html>
